name = "votehub-backend"
main = "src/index.ts"
compatibility_date = "2024-11-18"

# D1 Database (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "votehub-db"
database_id = "d6cdfd39-0304-4f54-9245-ce5498d6206f"

# KV Storage
[[kv_namespaces]]
binding = "KV"
id = "ebea5b8a75f7472ba9f54a96489557f1"

# Environment Variables
[vars]
ENVIRONMENT = "development"

# Secrets (set via wrangler secret put)
# GEMINI_API_KEY
# ENCRYPTION_KEY
